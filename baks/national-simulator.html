            victoryBox.style.maxWidth = '80%';
            
            // 添加胜利标题
            const victoryTitle = document.createElement('h2');
            victoryTitle.textContent = '胜利!';
            victoryTitle.style.color = winners[0].color.main;
            victoryTitle.style.fontSize = '32px';
            victoryTitle.style.marginBottom = '20px';
            
            // 添加胜利描述
            const victoryDesc = document.createElement('p');
            victoryDesc.innerHTML = `${winnerNames} 通过<strong>${reason}</strong>获得了胜利！`;
            victoryDesc.style.fontSize = '18px';
            victoryDesc.style.marginBottom = '20px';
            
            // 添加玩家得分表
            const scoreTable = document.createElement('div');
            scoreTable.style.marginBottom = '20px';
            
            const playerScores = calculatePlayerScores();
            playerScores.sort((a, b) => b.score - a.score);
            
            playerScores.forEach(playerScore => {
                const player = gameState.players.find(p => p.id === playerScore.playerId);
                const scoreRow = document.createElement('div');
                scoreRow.style.display = 'flex';
                scoreRow.style.justifyContent = 'space-between';
                scoreRow.style.padding = '5px 0';
                scoreRow.style.borderBottom = '1px solid #eee';
                
                const playerName = document.createElement('span');
                playerName.textContent = player.name;
                playerName.style.fontWeight = 'bold';
                playerName.style.color = player.color.main;
                
                const scoreDisplay = document.createElement('span');
                scoreDisplay.textContent = `得分: ${playerScore.score}`;
                
                scoreRow.appendChild(playerName);
                scoreRow.appendChild(scoreDisplay);
                scoreTable.appendChild(scoreRow);
            });
            
            // 添加新游戏按钮
            const newGameBtn = document.createElement('button');
            newGameBtn.textContent = '开始新游戏';
            newGameBtn.style.padding = '10px 20px';
            newGameBtn.style.backgroundColor = '#4CAF50';
            newGameBtn.style.color = 'white';
            newGameBtn.style.border = 'none';
            newGameBtn.style.borderRadius = '4px';
            newGameBtn.style.cursor = 'pointer';
            newGameBtn.style.fontSize = '16px';
            
            newGameBtn.addEventListener('click', () => {
                document.body.removeChild(victoryOverlay);
                const playerCount = Math.min(parseInt(prompt('请输入玩家数量 (2-5):', '2')) || 2, MAX_PLAYERS);
                initGame(Math.max(2, playerCount));
            });
            
            // 组装弹窗
            victoryBox.appendChild(victoryTitle);
            victoryBox.appendChild(victoryDesc);
            victoryBox.appendChild(scoreTable);
            victoryBox.appendChild(newGameBtn);
            victoryOverlay.appendChild(victoryBox);
            
            // 添加到页面
            document.body.appendChild(victoryOverlay);

        // 处理格子点击
        function handleTileClick(x, y) {
            const tileX = Math.floor(x / GRID_SIZE);
            const tileY = Math.floor(y / GRID_SIZE);
            
            if (tileX < 0 || tileX >= GRID_WIDTH || tileY < 0 || tileY >= GRID_HEIGHT) {
                return;
            }
            
            const tileIndex = tileY * GRID_WIDTH + tileX;
            const tile = gameState.map[tileIndex];
            const currentPlayer = gameState.players[gameState.currentPlayerIndex];
            
            // 如果是建筑模式
            if (gameState.buildingMode && gameState.selectedBuildingType) {
                // 确认该位置可以建造
                if (tile.ownerId === currentPlayer.id && !tile.building) {
                    // 检查地形是否适合建造
                    if (tile.terrain === 'water') {
                        showNotification("不能在水域上建造！", "error");
                        return;
                    }
                    
                    if (tile.terrain === 'mountain' && gameState.selectedBuildingType !== 'ironMine' && 
                        gameState.selectedBuildingType !== 'goldMine' && gameState.selectedBuildingType !== 'silverMine') {
                        showNotification("只能在山地上建造矿场！", "error");
                        return;
                    }
                    
                    const buildingType = gameState.selectedBuildingType;
                    const buildingCost = BUILDINGS[buildingType].cost;
                    
                    // 检查玩家是否有足够的金币
                    if (currentPlayer.gold >= buildingCost) {
                        // 扣除金币
                        currentPlayer.gold -= buildingCost;
                        
                        // 开始建造过程
                        gameState.buildingInProgress = {
                            x: tileX,
                            y: tileY,
                            type: buildingType,
                            progress: 50 // 第一回合完成50%
                        };
                        
                        // 记录日志
                        addLogEntry(`${currentPlayer.name}开始建造${BUILDINGS[buildingType].name}，花费${buildingCost}金币。`);
                        
                        // 显示通知
                        showNotification(`开始建造${BUILDINGS[buildingType].name}，将在下回合完成。`);
                        
                        // 退出建筑模式
                        gameState.buildingMode = false;
                        gameState.selectedBuildingType = null;
                        buildingPreview.style.display = 'none';
                        
                        // 更新UI
                        updateUI();
                    } else {
                        showNotification("金币不足！", "error");
                    }
                } else {
                    if (tile.ownerId !== currentPlayer.id) {
                        showNotification("不能在其他玩家的领土上建造！", "error");
                    } else if (tile.building) {
                        showNotification("这个位置已经有建筑了！", "error");
                    }
                }
            }
            // 如果是招募单位模式
            else if (gameState.recruitMode && gameState.selectedUnitType) {
                // 确认该位置可以招募单位
                if (tile.ownerId === currentPlayer.id) {
                    // 不能在水域上放置单位
                    if (tile.terrain === 'water') {
                        showNotification("不能在水域上放置单位！", "error");
                        return;
                    }
                    
                    // 不能在已有单位的格子上放置
                    if (tile.unit) {
                        showNotification("此位置已有单位！", "error");
                        return;
                    }
                    
                    // 招募单位
                    if (recruitUnit(tileX, tileY, gameState.selectedUnitType)) {
                        // 退出招募模式
                        gameState.recruitMode = false;
                        gameState.selectedUnitType = null;
                        document.getElementById('unit-preview').style.display = 'none';
                        
                        // 更新UI
                        updateUI();
                    }
                } else {
                    showNotification("只能在自己的领土上放置单位！", "error");
                }
            }
            // 如果是移动模式
            else if (gameState.moveMode && gameState.selectedUnit) {
                // 确认移动目标是有效的
                const srcX = gameState.selectedUnit.x;
                const srcY = gameState.selectedUnit.y;
                const srcTileIndex = srcY * GRID_WIDTH + srcX;
                const srcTile = gameState.map[srcTileIndex];
                
                // 计算曼哈顿距离
                const distance = Math.abs(tileX - srcX) + Math.abs(tileY - srcY);
                const moveRange = UNITS[gameState.selectedUnit.type].moveRange;
                
                if (distance <= moveRange && distance > 0) {
                    // 检查目标格子是否已有单位
                    if (tile.unit) {
                        showNotification("目标位置已有单位！", "error");
                        return;
                    }
                    
                    // 检查目标格子是否是水域
                    if (tile.terrain === 'water') {
                        showNotification("不能移动到水域！", "error");
                        return;
                    }
                    
                    // 执行移动
                    const unit = srcTile.unit;
                    unit.hasMoved = true;
                    unit.x = tileX;
                    unit.y = tileY;
                    
                    // 保存单位的原始所有者ID（修复所有权问题）
                    const unitOwnerId = unit.ownerId !== undefined ? unit.ownerId : srcTile.ownerId;
                    
                    // 保存单位的原始所有者
                    if (unit.ownerId === undefined) {
                        unit.ownerId = unitOwnerId;
                    }
                    
                    // 更新地图，确保单位所有权不变
                    tile.unit = unit;
                    srcTile.unit = null;
                    
                    // 添加关于敌方领土的效果
                    if (tile.ownerId !== unitOwnerId && tile.ownerId !== null) {
                        const enemyPlayer = gameState.players[tile.ownerId];
                        const unitPlayer = gameState.players[unitOwnerId];
                        addLogEntry(`${unitPlayer.name}的${UNITS[unit.type].name}进入了${enemyPlayer.name}的领土，单位将处于危险状态。`);
                    }
                    
                    // 添加日志
                    addLogEntry(`${gameState.players[unitOwnerId].name}的${UNITS[unit.type].name}从(${srcX},${srcY})移动到(${tileX},${tileY})。`);
                    
                    // 结束移动模式
                    gameState.moveMode = false;
                    gameState.selectedUnit = null;
                    
                    // 更新UI
                    updateUI();
                } else {
                    showNotification("移动距离超出范围！", "error");
                }
            }
            // 如果是攻击模式
            else if (gameState.attackMode && gameState.selectedUnit) {
                // 确认攻击目标是有效的
                const srcX = gameState.selectedUnit.x;
                const srcY = gameState.selectedUnit.y;
                const srcTileIndex = srcY * GRID_WIDTH + srcX;
                const srcTile = gameState.map[srcTileIndex];
                
                // 获取攻击者所有者ID
                const attackerOwnerId = srcTile.unit.ownerId !== undefined ? srcTile.unit.ownerId : srcTile.ownerId;
                
                // 计算曼哈顿距离
                const distance = Math.abs(tileX - srcX) + Math.abs(tileY - srcY);
                
                // 使用单位特定的攻击范围
                const attackRange = UNITS[gameState.selectedUnit.type].attackRange;
                
                if (distance <= attackRange) {
                    // 检查目标格子是否有敌方单位 - 使用unit.ownerId而不是tile.ownerId
                    if (tile.unit) {
                        const defenderOwnerId = tile.unit.ownerId !== undefined ? tile.unit.ownerId : tile.ownerId;
                        
                        if (defenderOwnerId !== attackerOwnerId) {
                            // 执行攻击
                            const attackerUnit = srcTile.unit;
                            const defenderUnit = tile.unit;
                            const attackerPlayer = gameState.players[attackerOwnerId];
                            const defenderPlayer = gameState.players[defenderOwnerId];
                            
                            // 计算伤害
                            const attackDamage = Math.max(0, UNITS[attackerUnit.type].attack - UNITS[defenderUnit.type].defense / 2);
                            
                            // 造成伤害
                            defenderUnit.health -= attackDamage;
                            
                            // 添加日志
                            addLogEntry(`${attackerPlayer.name}的${UNITS[attackerUnit.type].name}攻击了${defenderPlayer.name}的${UNITS[defenderUnit.type].name}，造成${attackDamage}点伤害。`);
                            
                            // 检查目标单位是否被消灭
                            if (defenderUnit.health <= 0) {
                                // 移除被消灭的单位
                                const defenderIndex = defenderPlayer.units.findIndex(u => u.id === defenderUnit.id);
                                if (defenderIndex !== -1) {
                                    defenderPlayer.units.splice(defenderIndex, 1);
                                }
                                
                                // 减少维护费
                                if (defenderUnit.requiresMaintenance !== false) {
                                    defenderPlayer.militaryMaintenance -= UNITS[defenderUnit.type].maintenance;
                                }
                                
                                // 清除格子上的单位
                                tile.unit = null;
                                
                                // 添加日志
                                addLogEntry(`${defenderPlayer.name}的${UNITS[defenderUnit.type].name}被消灭了！`);
                            }
                            
                            // 标记攻击者已攻击
                            attackerUnit.hasAttacked = true;
                            
                            // 结束攻击模式
                            gameState.attackMode = false;
                            
                            // 更新UI
                            updateUI();
                        } else {
                            showNotification("不能攻击自己的单位！", "error");
                        }
                    } 
                    // 检查目标格子是否有敌方建筑但没有防守单位
                    else if (!tile.unit && tile.building && tile.ownerId !== attackerOwnerId) {
                        // 执行对建筑的攻击，传递攻击者ID
                        attackBuilding(srcTile, tile, attackerOwnerId);
                        
                        // 结束攻击模式
                        gameState.attackMode = false;
                        
                        // 更新UI
                        updateUI();
                    }
                    else if (!tile.unit && !tile.building) {
                        showNotification("目标位置没有单位或建筑！", "error");
                    } else {
                        showNotification("不能攻击自己的单位或建筑！", "error");
                    }
                } else {
                    showNotification(`攻击距离超出范围！最大攻击范围为${attackRange}。`, "error");
                }
            }
            // 如果是修理模式
            else if (gameState.repairMode && gameState.selectedTile) {
                // 确保选中的源格子有修理厂
                const selectedTileIndex = gameState.selectedTile.y * GRID_WIDTH + gameState.selectedTile.x;
                const selectedTile = gameState.map[selectedTileIndex];
                
                if (selectedTile.building && selectedTile.building.type === 'repairShop') {
                    // 尝试修理被点击的格子上的建筑
                    if (tile.building) {
                        // 检查是否是己方建筑
                        if (tile.ownerId === gameState.currentPlayerIndex) {
                            // 调用修理函数
                            repairBuilding(selectedTile, tile);
                        } else {
                            showNotification("无法修理敌方建筑！", "error");
                        }
                    } else {
                        showNotification("该位置没有建筑可以修理！", "error");
                    }
                } else {
                    showNotification("请先选择一个修理厂！", "error");
                }
                
                // 退出修理模式
                gameState.repairMode = false;
                
                // 更新UI
                updateUI();
            }
            // 普通选择格子
            else {
                gameState.selectedTile = { x: tileX, y: tileY };
                updateSelectionInfo();
                
                // 如果是当前玩家的修理厂，显示修理按钮
                if (tile.building && tile.building.type === 'repairShop' && tile.ownerId === gameState.currentPlayerIndex) {
                    const actionPanel = document.getElementById('action-panel');
                    if (actionPanel) {
                        // 创建修理按钮
                        const repairButton = document.createElement('button');
                        repairButton.textContent = '修理建筑';
                        repairButton.className = 'action-button';
                        repairButton.onclick = function() {
                            // 进入修理模式
                            gameState.repairMode = true;
                            showNotification("请选择要修理的建筑", "info");
                            
                            // 高亮显示可以修理的建筑
                            highlightRepairableBuildings(gameState.currentPlayerIndex);
                        };
                        actionPanel.appendChild(repairButton);
                    }
                }
            }
            
            // 重绘地图
            drawMap();
        }
        
        // 显示通知
        function showNotification(message, type = "info") {
            notification.textContent = message;
            notification.className = "game-notification show";
            
            if (type === "error") {
                notification.style.backgroundColor = "rgba(231, 76, 60, 0.8)";
            } else {
                notification.style.backgroundColor = "rgba(0, 0, 0, 0.8)";
            }
            
            setTimeout(() => {
                notification.className = "game-notification";
            }, 2000);
        }
        
        // 添加游戏日志
        function addLogEntry(message) {
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `<small>[${timeStr}]</small> ${message}`;
            
            gameLog.appendChild(logEntry);
            
            // 自动滚动到底部
            gameLog.scrollTop = gameLog.scrollHeight;
            
            // 保持日志条目限制
            if (gameState.gameLog.length > 50) {
                gameState.gameLog.shift();
            }
            gameState.gameLog.push(message);
        }
        
        // 扩张领土
        function expandTerritory(x, y, playerId) {
            // 建筑周围的影响范围
            const radius = 1;
            
            // 遍历周围的格子
            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                    const nx = x + dx;
                    const ny = y + dy;
                    
                    // 确保在地图范围内
                    if (nx >= 0 && nx < GRID_WIDTH && ny >= 0 && ny < GRID_HEIGHT) {
                        const tileIndex = ny * GRID_WIDTH + nx;
                        const tile = gameState.map[tileIndex];
                        
                        // 只占领没有所有者的格子
                        if (tile.ownerId === null) {
                            tile.ownerId = playerId;
                        }
                    }
                }
            }
        }

        function cancelAction() {
            if (gameState.buildingMode) {
                gameState.buildingMode = false;
                gameState.selectedBuildingType = null;

                showNotification("已取消建造");
            } else if (gameState.recruitMode) {
                gameState.recruitMode = false;
                gameState.selectedUnitType = null;
                document.getElementById('unit-preview').style.display = 'none';
                showNotification("已取消招募");
            } else if (gameState.attackMode) {

            } else if (gameState.moveMode) {

            } else if (gameState.buildingInProgress) {
                // 返还一半的建筑费用
                const buildingType = gameState.buildingInProgress.type;
                const refund = Math.floor(BUILDINGS[buildingType].cost * 0.5);
                const playerId = gameState.map[gameState.buildingInProgress.y * GRID_WIDTH + gameState.buildingInProgress.x].ownerId;
                gameState.players[playerId].gold += refund;
                
                addLogEntry(`${gameState.players[playerId].name}取消了${BUILDINGS[buildingType].name}的建造，获得${refund}金币退款。`);
                showNotification(`已取消建造，退还${refund}金币`);
                
                gameState.buildingInProgress = null;

            // 更新UI
            updateUI();

        // 初始化游戏
        initGame(2);

        // 单位攻击建筑
        function attackBuilding(attackerTile, defenderTile, attackerOwnerId) {
            const attackerUnit = attackerTile.unit;
            const building = defenderTile.building;
            const defenderPlayer = gameState.players[defenderTile.ownerId];
            const attackerPlayer = gameState.players[attackerOwnerId];
            
            // 确保建筑有生命值
            if (!building.health) {
                if (building.type === 'capital') {
                    building.health = BUILDINGS.capital.maxHealth; // 使用常量定义的生命值
                } else if (BUILDINGS[building.type]) {
                    building.health = BUILDINGS[building.type].maxHealth;
                } else {
                    building.health = 200; // 默认生命值
                }
            }
            
            // 计算伤害 (增加对建筑的伤害系数从1/2到0.75)
            const attackDamage = Math.floor(UNITS[attackerUnit.type].attack * 0.75);
            
            // 造成伤害
            building.health -= attackDamage;
            
            // 添加攻击日志
            let buildingName = building.name;
            if (building.type === 'capital') {
                buildingName = '首都';
            } else if (BUILDINGS[building.type]) {
                buildingName = BUILDINGS[building.type].name;
            }
            
            addLogEntry(`${attackerPlayer.name}的${UNITS[attackerUnit.type].name}攻击了${defenderPlayer.name}的${buildingName}，造成${attackDamage}点伤害。`);
            
            // 检查建筑是否被摧毁
            if (building.health <= 0) {
                // 如果是首都被摧毁，可能会触发胜利条件
                if (building.type === 'capital') {
                    addLogEntry(`${defenderPlayer.name}的首都被${attackerPlayer.name}摧毁了！`);
                    showNotification(`${defenderPlayer.name}的首都被摧毁了！`, "info");
                } else {
                    addLogEntry(`${defenderPlayer.name}的${buildingName}被${attackerPlayer.name}摧毁了！`);
                    showNotification(`${buildingName}被摧毁了！`, "info");
                    
                    // 如果是有收入的建筑，减少玩家收入
                    if (BUILDINGS[building.type] && BUILDINGS[building.type].income) {
                        defenderPlayer.income -= BUILDINGS[building.type].income;
                    }
                }
                
                // 清除格子上的建筑
                defenderTile.building = null;
                
                // 检查胜利条件
                checkVictoryConditions();
            } else {
                // 更新建筑损伤状态，影响收益
                updateBuildingDamageEffect(defenderTile, defenderPlayer);
            }
            
            // 标记攻击者已攻击
            attackerUnit.hasAttacked = true;
        }

        // 添加一个新函数，更新建筑损伤对收益的影响
        function updateBuildingDamageEffect(tile, player) {
            const building = tile.building;
            const buildingType = building.type;
            
            if (!BUILDINGS[buildingType] || !BUILDINGS[buildingType].income || BUILDINGS[buildingType].income <= 0) {
                return; // 只处理有正收益的建筑
            }
            
            const maxHealth = BUILDINGS[buildingType].maxHealth;
            const healthPercent = building.health / maxHealth;
            
            // 重置之前可能的收益损失
            if (building.damagedIncomeReduction) {
                // 恢复之前减少的收益
                player.income += building.damagedIncomeReduction;
                building.damagedIncomeReduction = 0;
            }
            
            let newIncomeReduction = 0;
            
            // 根据损伤程度减少收益
            if (healthPercent < 0.25) {
                // 低于25%生命值，收益减少50%
                newIncomeReduction = Math.floor(BUILDINGS[buildingType].income * 0.5);
                
                // 记录收益减少的日志，但只在第一次达到该阈值时
                if (!building.reachedCriticalDamage) {
                    building.reachedCriticalDamage = true;
                    addLogEntry(`${player.name}的${BUILDINGS[buildingType].name}严重受损，收益减少50%！`);
                }
            } else if (healthPercent < 0.5) {
                // 低于50%生命值，收益减少25%
                newIncomeReduction = Math.floor(BUILDINGS[buildingType].income * 0.25);
                
                // 记录收益减少的日志，但只在第一次达到该阈值时
                if (!building.reachedModerateDamage && !building.reachedCriticalDamage) {
                    building.reachedModerateDamage = true;
                    addLogEntry(`${player.name}的${BUILDINGS[buildingType].name}中度受损，收益减少25%！`);
                }
                
                // 如果从严重损伤恢复到中度损伤，重置严重损伤标记并添加日志
                if (building.reachedCriticalDamage) {
                    building.reachedCriticalDamage = false;
                    addLogEntry(`${player.name}的${BUILDINGS[buildingType].name}状态有所改善，收益减少从50%降低到25%。`);
                }
            } else {
                // 如果从损伤状态恢复，添加日志
                if (building.reachedModerateDamage || building.reachedCriticalDamage) {
                    building.reachedModerateDamage = false;
                    building.reachedCriticalDamage = false;
                    addLogEntry(`${player.name}的${BUILDINGS[buildingType].name}已修复到良好状态，恢复全额收益。`);
                }
            }
            
            // 应用新的收益减少
            if (newIncomeReduction > 0) {
                player.income -= newIncomeReduction;
                building.damagedIncomeReduction = newIncomeReduction;
            }
        }

        // 为建筑分配唯一ID
        function generateBuildingId() {
            return Date.now() + Math.floor(Math.random() * 10000);
        }

        // 启动军厂生产
        function startFactoryProduction(tile, unitType) {
            const buildingType = tile.building.type;
            const player = gameState.players[tile.ownerId];
            
            // 检查是否已达到本轮步兵生产上限
            if (unitType === 'infantry' && gameState.factoryProduction.infantryProducedThisRound >= gameState.factoryProduction.infantryProductionLimit) {
                showNotification("本轮步兵生产已达上限！", "error");
                return false;
            }
            
            // 确保建筑有唯一ID
            if (!tile.building.id) {
                tile.building.id = generateBuildingId();
            }
            
            // 检查该建筑是否已在生产
            const existingProduction = gameState.factoryProduction.productionQueues.find(q => q.buildingId === tile.building.id);
            if (existingProduction) {
                showNotification("该工厂已在生产中！", "error");
                return false;
            }
            
            // 创建生产队列项
            const productionItem = {
                buildingId: tile.building.id,
                buildingType: buildingType,
                unitType: unitType,
                progress: 0,
                tileX: tile.x,
                tileY: tile.y,
                requiresMaintenance: false
            };
            
            // 根据工厂类型设置进度
            if (buildingType === 'armoryFactory') {
                productionItem.totalTurns = 2; // 军厂需要2回合生产一个步兵
            } else if (buildingType === 'bigArmoryFactory') {
                productionItem.totalTurns = 4; // 大军厂需要4回合生产一个步兵
            }
            
            // 添加到生产队列
            gameState.factoryProduction.productionQueues.push(productionItem);
            
            // 如果是军厂生产步兵，增加本轮计数
            if (buildingType === 'armoryFactory' && unitType === 'infantry') {
                gameState.factoryProduction.infantryProducedThisRound++;
            }
            
            // 添加日志
            const factoryName = BUILDINGS[buildingType].name;
            const unitName = UNITS[unitType].name;
            addLogEntry(`${player.name}的${factoryName}开始生产${unitName}，预计${productionItem.totalTurns}回合后完成。`);
            showNotification(`开始生产${unitName}！`);
            
            return true;
        }

        // 处理工厂生产进度
        function processFactoryProduction() {
            const currentPlayer = gameState.players[gameState.currentPlayerIndex];
            const completedProductions = [];
            
            // 检查军厂，添加生产队列
            gameState.map.forEach(tile => {
                if (tile.ownerId === currentPlayer.id && tile.building) {
                    // 军厂生产步兵
                    if (tile.building.type === 'armoryFactory' && 
                        gameState.factoryProduction.infantryProducedThisRound < gameState.factoryProduction.infantryProductionLimit) {
                        
                        // 检查是否已经在生产队列中
                        const alreadyInQueue = gameState.factoryProduction.productionQueues.some(
                            item => item.buildingId === tile.building.id
                        );
                        
                        if (!alreadyInQueue) {
                            // 添加到生产队列
                            gameState.factoryProduction.productionQueues.push({
                                buildingId: tile.building.id,
                                buildingType: 'armoryFactory',
                                unitType: 'infantry',
                                progress: 0,
                                totalTurns: 2, // 2回合生产一个步兵
                                tileX: tile.x,
                                tileY: tile.y
                            });
                            
                            gameState.factoryProduction.infantryProducedThisRound++;
                            addLogEntry(`${currentPlayer.name}的军厂开始生产步兵。`);
                        }
                    }
                    // 大军厂生产步兵 - 没有数量限制
                    else if (tile.building.type === 'bigArmoryFactory') {
                        // 检查是否已经在生产队列中
                        const alreadyInQueue = gameState.factoryProduction.productionQueues.some(
                            item => item.buildingId === tile.building.id
                        );
                        
                        if (!alreadyInQueue) {
                            // 添加到生产队列
                            gameState.factoryProduction.productionQueues.push({
                                buildingId: tile.building.id,
                                buildingType: 'bigArmoryFactory',
                                unitType: 'infantry',
                                progress: 0,
                                totalTurns: 4, // 4回合生产一个步兵
                                tileX: tile.x,
                                tileY: tile.y
                            });
                            
                            addLogEntry(`${currentPlayer.name}的大军厂开始生产步兵。`);
                        }
                    }
                    // 军营生产骑兵
                    else if (tile.building.type === 'barracks' && 
                        gameState.factoryProduction.cavalryProducedThisRound < gameState.factoryProduction.cavalryProductionLimit) {
                        
                        // 检查是否已经在生产队列中
                        const alreadyInQueue = gameState.factoryProduction.productionQueues.some(
                            item => item.buildingId === tile.building.id
                        );
                        
                        if (!alreadyInQueue) {
                            // 添加到生产队列
                            gameState.factoryProduction.productionQueues.push({
                                buildingId: tile.building.id,
                                buildingType: 'barracks',
                                unitType: 'cavalry',
                                progress: 0,
                                totalTurns: 2, // 2回合生产一个骑兵
                                tileX: tile.x,
                                tileY: tile.y
                            });
                            
                            gameState.factoryProduction.cavalryProducedThisRound++;
                            addLogEntry(`${currentPlayer.name}的军营开始生产骑兵。`);
                        }
                    }
                }
            });
            
            // 更新所有生产进度
            gameState.factoryProduction.productionQueues.forEach(item => {
                // 只处理当前玩家的生产队列
                const tile = gameState.map.find(t => t.x === item.tileX && t.y === item.tileY);
                if (tile && tile.ownerId === currentPlayer.id) {
                    item.progress++;
                    
                    // 检查是否完成
                    if (item.progress >= item.totalTurns) {
                        completedProductions.push(item);
                    }
                }
            });
            
            // 处理完成的生产
            completedProductions.forEach(item => {
                const tile = gameState.map.find(t => t.x === item.tileX && t.y === item.tileY);
                if (tile && tile.building) {
                    // 寻找周围可放置单位的格子
                    const placementTile = findNearbyEmptyTile(item.tileX, item.tileY);
                    
                    if (placementTile) {
                        // 创建单位
                        const newUnit = {
                            id: Date.now() + Math.floor(Math.random() * 10000),
                            type: item.unitType,
                            x: placementTile.x,
                            y: placementTile.y,
                            health: UNITS[item.unitType].health,
                            hasMoved: true, // 新生产的单位本回合不能移动
                            hasAttacked: true, // 新生产的单位本回合不能攻击
                            // 大军厂生产的步兵和军营生产的骑兵不需要维护费
                            requiresMaintenance: item.buildingType === 'bigArmoryFactory',
                            ownerId: currentPlayer.id // 明确设置单位所有者ID
                        };
                        
                        // 更新地图和玩家单位列表
                        placementTile.unit = newUnit;
                        currentPlayer.units.push(newUnit);
                        
                        // 如果需要维护费，增加玩家的军事维护费
                        if (newUnit.requiresMaintenance) {
                            currentPlayer.militaryMaintenance += UNITS[item.unitType].maintenance;
                        }
                        
                        // 添加日志
                        const factoryName = BUILDINGS[item.buildingType].name;
                        const unitName = UNITS[item.unitType].name;
                        addLogEntry(`${currentPlayer.name}的${factoryName}生产的${unitName}已完成并部署。`);
                    } else {
                        // 没有空间放置单位
                        addLogEntry(`${currentPlayer.name}的工厂生产的单位因周围没有空间而无法部署。`);
                    }
                    
                    // 从生产队列中移除
                    const index = gameState.factoryProduction.productionQueues.findIndex(q => 
                        q.buildingId === item.buildingId && q.unitType === item.unitType
                    );
                    if (index !== -1) {
                        gameState.factoryProduction.productionQueues.splice(index, 1);
                    }
                }
            });
        }

        // 寻找附近空的格子来放置单位
        function findNearbyEmptyTile(x, y) {
            const directions = [
                {dx: 0, dy: -1}, // 上
                {dx: 1, dy: 0},  // 右
                {dx: 0, dy: 1},  // 下
                {dx: -1, dy: 0}, // 左
                {dx: 1, dy: -1}, // 右上
                {dx: 1, dy: 1},  // 右下
                {dx: -1, dy: 1}, // 左下
                {dx: -1, dy: -1} // 左上
            ];
            
            // 检查周围的8个方向
            for (const dir of directions) {
                const nx = x + dir.dx;
                const ny = y + dir.dy;
                
                // 确保在地图范围内
                if (nx >= 0 && nx < GRID_WIDTH && ny >= 0 && ny < GRID_HEIGHT) {
                    const tileIndex = ny * GRID_WIDTH + nx;
                    const tile = gameState.map[tileIndex];
                    
                    // 检查该格子是否可以放置单位
                    if (tile.ownerId === gameState.currentPlayerIndex && !tile.unit && tile.terrain !== 'water') {
                        return tile;
                    }
                }
            }
            
            return null; // 没有找到合适的格子
        }

        // 处理领土控制系统
        function processTerritoryControl() {
            // 遍历所有格子
            gameState.map.forEach(tile => {
                // 如果格子上有单位
                if (tile.unit && tile.ownerId !== null) {
                    const unitOwnerId = tile.unit.ownerId !== undefined ? tile.unit.ownerId : null;
                    
                    // 如果单位所有者与领土所有者不同
                    if (unitOwnerId !== null && unitOwnerId !== tile.ownerId) {
                        // 降低领土控制值
                        tile.territoryControl -= gameState.territoryControlLossPerTurn;
                        
                        // 如果控制值降至0，领土变为中立
                        if (tile.territoryControl <= 0) {
                            const formerOwner = gameState.players[tile.ownerId];
                            const unitOwner = gameState.players[unitOwnerId];
                            
                            // 记录领土变化
                            addLogEntry(`${unitOwner.name}的单位侵占了${formerOwner.name}的领土，(${tile.x},${tile.y})格子变为中立。`);
                            
                            // 领土变为中立
                            tile.ownerId = null;
                            tile.territoryControl = gameState.territoryControlMax / 2; // 设为一半的控制值
                            
                            // 如果有建筑，销毁建筑（可选，取决于游戏设计）
                            if (tile.building) {
                                const buildingName = tile.building.type === 'capital' ? 
                                    '首都' : (BUILDINGS[tile.building.type]?.name || tile.building.name);
                                
                                addLogEntry(`${formerOwner.name}的${buildingName}被摧毁了！`);
                                
                                // 如果是有收入的建筑，减少玩家收入
                                if (BUILDINGS[tile.building.type] && BUILDINGS[tile.building.type].income) {
                                    formerOwner.income -= BUILDINGS[tile.building.type].income;
                                }
                                
                                // 清除建筑
                                tile.building = null;
                            }
                        }
                    }
                }
                // 如果格子是中立的，并且有玩家单位停留
                else if (tile.ownerId === null && tile.unit) {
                    const unitOwnerId = tile.unit.ownerId !== undefined ? tile.unit.ownerId : null;
                    
                    if (unitOwnerId !== null) {
                        // 增加单位所有者对该格子的控制
                        tile.territoryControl += gameState.territoryControlLossPerTurn;
                        
                        // 如果控制值达到最大值，领土归属该玩家
                        if (tile.territoryControl >= gameState.territoryControlMax) {
                            const unitOwner = gameState.players[unitOwnerId];
                            
                            // 记录领土变化
                            addLogEntry(`${unitOwner.name}占领了位于(${tile.x},${tile.y})的中立领土。`);
                            
                            // 领土归属该玩家
                            tile.ownerId = unitOwnerId;
                            tile.territoryControl = gameState.territoryControlMax;
                        }
                    }
                }
            });
        }

        // 添加首都
        function addCapitals() {
            const player1 = gameState.players[0];
            const player2 = gameState.players[1];
            
            // 获取适合首都的位置
            const player1CapitalPos = { x: Math.floor(GRID_WIDTH / 4), y: Math.floor(GRID_HEIGHT / 2) };
            const player2CapitalPos = { x: Math.floor(GRID_WIDTH * 3 / 4), y: Math.floor(GRID_HEIGHT / 2) };
            
            // 设置首都和周围地形
            const player1CapitalTile = gameState.map.find(tile => tile.x === player1CapitalPos.x && tile.y === player1CapitalPos.y);
            player1CapitalTile.ownerId = player1.id;
            player1CapitalTile.controlValue = 100; // 完全控制
            player1CapitalTile.building = { 
                type: 'capital', 
                name: `${player1.name}的首都`,
                health: BUILDINGS.capital.maxHealth // 首都的生命值
            };
            
            const player2CapitalTile = gameState.map.find(tile => tile.x === player2CapitalPos.x && tile.y === player2CapitalPos.y);
            player2CapitalTile.ownerId = player2.id;
            player2CapitalTile.controlValue = 100; // 完全控制
            player2CapitalTile.building = { 
                type: 'capital', 
                name: `${player2.name}的首都`,
                health: BUILDINGS.capital.maxHealth // 首都的生命值
            };
            
            // 为首都周围的一圈格子设置领土
            for (let dx = -2; dx <= 2; dx++) {
                for (let dy = -2; dy <= 2; dy++) {
                    if (dx === 0 && dy === 0) continue; // 跳过首都格子
                    
                    // 玩家1的周边领土
                    const x1 = player1CapitalPos.x + dx;
                    const y1 = player1CapitalPos.y + dy;
                    if (x1 >= 0 && x1 < GRID_WIDTH && y1 >= 0 && y1 < GRID_HEIGHT) {
                        const tile = gameState.map.find(tile => tile.x === x1 && tile.y === y1);
                        tile.ownerId = player1.id;
                        tile.controlValue = 100; // 完全控制
                    }
                    
                    // 玩家2的周边领土
                    const x2 = player2CapitalPos.x + dx;
                    const y2 = player2CapitalPos.y + dy;
                    if (x2 >= 0 && x2 < GRID_WIDTH && y2 >= 0 && y2 < GRID_HEIGHT) {
                        const tile = gameState.map.find(tile => tile.x === x2 && tile.y === y2);
                        tile.ownerId = player2.id;
                        tile.controlValue = 100; // 完全控制
                    }
                }
            }
            
            // 如果有额外的玩家，为他们添加首都
            for (let i = 2; i < gameState.players.length; i++) {
                const player = gameState.players[i];
                // 随机位置
                let capitalX, capitalY;
                do {
                    capitalX = Math.floor(Math.random() * GRID_WIDTH);
                    capitalY = Math.floor(Math.random() * GRID_HEIGHT);
                    // 确保与其他首都保持一定距离
                } while (Math.abs(capitalX - player1CapitalPos.x) < 5 && Math.abs(capitalY - player1CapitalPos.y) < 5 ||
                         Math.abs(capitalX - player2CapitalPos.x) < 5 && Math.abs(capitalY - player2CapitalPos.y) < 5);
                
                const capitalTile = gameState.map.find(tile => tile.x === capitalX && tile.y === capitalY);
                capitalTile.ownerId = player.id;
                capitalTile.controlValue = 100; // 完全控制
                capitalTile.building = { 
                    type: 'capital', 
                    name: `${player.name}的首都`,
                    health: BUILDINGS.capital.maxHealth // 首都的生命值
                };
                
                // 为首都周围的一圈格子设置领土
                for (let dx = -2; dx <= 2; dx++) {
                    for (let dy = -2; dy <= 2; dy++) {
                        if (dx === 0 && dy === 0) continue; // 跳过首都格子
                        
                        const x = capitalX + dx;
                        const y = capitalY + dy;
                        if (x >= 0 && x < GRID_WIDTH && y >= 0 && y < GRID_HEIGHT) {
                            const tile = gameState.map.find(tile => tile.x === x && tile.y === y);
                            tile.ownerId = player.id;
                            tile.controlValue = 100; // 完全控制
                        }
                    }
                }
            }
        }

        // 在地图上放置建筑
        function placeBuildingOnTile(buildingType, tile) {
            const player = gameState.players[gameState.currentPlayerIndex];
            
            // 添加建筑
            let health = 200; // 默认健康值
            if (BUILDINGS[buildingType] && BUILDINGS[buildingType].maxHealth) {
                health = BUILDINGS[buildingType].maxHealth;
            }
            
            // 设置建筑
            tile.building = {
                type: buildingType,
                health: health
            };
            
            // 更新玩家收入
            if (BUILDINGS[buildingType] && BUILDINGS[buildingType].income) {
                player.income += BUILDINGS[buildingType].income;
            }
            
            // 添加日志
            const buildingName = BUILDINGS[buildingType].name;
            addLogEntry(`${player.name}建造了${buildingName}`);
            
            // 重置建筑模式
            gameState.buildMode = false;
            gameState.selectedBuildingType = null;
            
            // 清空建筑预览
            document.getElementById('building-preview').style.display = 'none';
            
            // 更新UI
            updateUI();
            drawMap();
        }

        // 处理建筑物健康值恢复
        function healBuildings(playerId) {
            gameState.map.forEach(tile => {
                if (tile.ownerId === playerId && tile.building && tile.building.health !== undefined) {
                    const buildingType = tile.building.type;
                    const maxHealth = buildingType === 'capital' ? BUILDINGS.capital.maxHealth : (BUILDINGS[buildingType] ? BUILDINGS[buildingType].maxHealth : 200);
                    
                    // 如果健康值不是满的，则恢复一定量的健康值
                    if (tile.building.health < maxHealth) {
                        // 计算恢复量 (每回合恢复最大健康值的5%)
                        const healAmount = Math.ceil(maxHealth * 0.05);
                        
                        // 应用恢复量，但不超过最大健康值
                        tile.building.health = Math.min(tile.building.health + healAmount, maxHealth);
                        
                        // 如果恢复到满，添加日志
                        if (tile.building.health === maxHealth) {
                            const buildingName = buildingType === 'capital' ? '首都' : BUILDINGS[buildingType].name;
                            addLogEntry(`${gameState.players[playerId].name}的${buildingName}已完全恢复。`);
                        }
                    }
                }
            });
        }

        // 建筑物信息显示
        function updateSelectedTileInfo(tile) {
            const infoPanel = document.getElementById('tile-info');
            
            // ... existing code ...
            
            if (tile.building) {
                const buildingType = tile.building.type;
                let buildingName;
                
                if (buildingType === 'capital') {
                    buildingName = '首都';
                } else if (BUILDINGS[buildingType]) {
                    buildingName = BUILDINGS[buildingType].name;
                } else {
                    buildingName = buildingType;
                }
                
                // 获取建筑健康信息
                let healthInfo = '';
                if (tile.building.health !== undefined) {
                    const maxHealth = buildingType === 'capital' ? BUILDINGS.capital.maxHealth : (BUILDINGS[buildingType] ? BUILDINGS[buildingType].maxHealth : 200);
                    const healthPercent = Math.floor((tile.building.health / maxHealth) * 100);
                    
                    // 根据健康值设置颜色
                    let healthColor = '#2ecc71'; // 绿色: 健康
                    let healthStatus = '健康';
                    
                    if (healthPercent < 25) {
                        healthColor = '#e74c3c'; // 红色: 危险
                        healthStatus = '严重受损 (收益-50%)';
                    } else if (healthPercent < 50) {
                        healthColor = '#f39c12'; // 黄色: 警告
                        healthStatus = '受损 (收益-25%)';
                    }
                    
                    healthInfo = `
                        <div style="margin-top: 5px;">
                            <strong>健康值:</strong> ${tile.building.health}/${maxHealth} (${healthPercent}%)
                            <div style="width: 100%; background-color: #ddd; height: 8px; margin-top: 3px;">
                                <div style="width: ${healthPercent}%; background-color: ${healthColor}; height: 8px;"></div>
                            </div>
                            <div style="font-size: 12px; color: ${healthColor}; margin-top: 2px;">${healthStatus}</div>
                        </div>
                    `;
                }
                
                // ... existing code ...
            }
            
            // ... existing code ...
        }

        // 添加新函数：高亮显示可修理的建筑
        function highlightRepairableBuildings(playerId) {
            const ctx = document.getElementById('game-canvas').getContext('2d');
            
            // 重新绘制地图
            drawMap();
            
            // 遍历地图，查找该玩家拥有的受损建筑
            gameState.map.forEach(tile => {
                if (tile.ownerId === playerId && tile.building && tile.building.health) {
                    const buildingType = tile.building.type;
                    const maxHealth = buildingType === 'capital' ? BUILDINGS.capital.maxHealth : BUILDINGS[buildingType].maxHealth;
                    
                    // 如果建筑受损，高亮显示
                    if (tile.building.health < maxHealth) {
                        const x = tile.x * GRID_SIZE;
                        const y = tile.y * GRID_SIZE;
                        
                        // 绘制高亮边框
                        ctx.strokeStyle = '#00ff00'; // 绿色边框
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x, y, GRID_SIZE, GRID_SIZE);
                        
                        // 添加修理图标
                        ctx.fillStyle = '#00ff00';
                        ctx.beginPath();
                        ctx.arc(x + GRID_SIZE - 8, y + 8, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(x + GRID_SIZE - 10, y + 8);
                        ctx.lineTo(x + GRID_SIZE - 6, y + 8);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(x + GRID_SIZE - 8, y + 6);
                        ctx.lineTo(x + GRID_SIZE - 8, y + 10);
                        ctx.stroke();
                    }
                }
            });
        }

        // 添加新函数：修理建筑物
        function repairBuilding(repairShopTile, targetTile) {
            const repairShop = repairShopTile.building;
            const targetBuilding = targetTile.building;
            const player = gameState.players[repairShopTile.ownerId];
            
            if (!targetBuilding) {
                showNotification("没有建筑可以修理！", "error");
                return false;
            }
            
            const buildingType = targetBuilding.type;
            const maxHealth = buildingType === 'capital' ? BUILDINGS.capital.maxHealth : BUILDINGS[buildingType].maxHealth;
            
            if (targetBuilding.health >= maxHealth) {
                showNotification("该建筑已处于满健康状态！", "info");
                return false;
            }
            
            // 计算修理费用 - 根据损失的健康值比例计算
            const healthPercentLost = 1 - (targetBuilding.health / maxHealth);
            const repairCost = Math.ceil(BUILDINGS[buildingType].cost * 0.2 * healthPercentLost);
            
            if (player.gold < repairCost) {
                showNotification(`金币不足！修理需要${repairCost}金币。`, "error");
                return false;
            }
            
            // 扣除金币
            player.gold -= repairCost;
            
            // 修复建筑
            const oldHealth = targetBuilding.health;
            targetBuilding.health = maxHealth;
            
            // 更新建筑损伤状态对收益的影响
            updateBuildingDamageEffect(targetTile, player);
            
            // 添加日志
            const buildingName = buildingType === 'capital' ? '首都' : BUILDINGS[buildingType].name;
            addLogEntry(`${player.name}花费${repairCost}金币修复了${buildingName}，健康值从${oldHealth}恢复到${maxHealth}。`);
            
            // 显示通知
            showNotification(`${buildingName}已修复！`, "success");
            
            return true;
        }

        // 初始化游戏状态时添加修理模式标志
        function initGameState(playerCount) {
            // ... existing initialization code ...
            
            gameState = {
                map: [],
                players: [],
                currentPlayerIndex: 0,
                selectedTile: null,
                buildMode: false,
                selectedBuildingType: null,
                buildingInProgress: null,
                moveMode: false,
                attackMode: false,
                repairMode: false, // 添加修理模式标志
                recruitMode: false,
                selectedUnitType: null,
                // ... other properties ...
            };
            
            // ... rest of initialization code ...
        }

        function buildBuilding(x, y, buildingType) {
            const tileIndex = y * GRID_WIDTH + x;
            const tile = gameState.map[tileIndex];
            const buildingCost = BUILDINGS[buildingType].cost;
            const currentPlayer = gameState.players[gameState.currentPlayerIndex];
            
            // 检查是否有足够的金币
            if (currentPlayer.gold < buildingCost) {
                showNotification("金币不足！", "error");
                return false;
            }
            
            // 检查是否是军厂或大军厂，增加计数
            if (buildingType === 'armoryFactory') {
                gameState.factoryProduction.armoryFactoryBuiltThisRound++;
            } else if (buildingType === 'bigArmoryFactory') {
                gameState.factoryProduction.bigArmoryFactoryBuiltThisRound++;
            } else if (buildingType === 'barracks') {
                gameState.factoryProduction.barracksBuiltThisRound++;
            }
            
            // 扣除金币
            currentPlayer.gold -= buildingCost;
            
            // 建立建筑
            tile.building = {
                type: buildingType,
                name: BUILDINGS[buildingType].name,
                income: BUILDINGS[buildingType].income,
                health: BUILDINGS[buildingType].maxHealth,
                id: generateBuildingId()
            };
            
            // 计算收入影响
            if (BUILDINGS[buildingType].income > 0) {
                currentPlayer.income += BUILDINGS[buildingType].income;
            } else {
                // 负收入视为维护费
                currentPlayer.militaryMaintenance += Math.abs(BUILDINGS[buildingType].income);
            }
            
            // 添加到玩家建筑列表
            currentPlayer.buildings.push(tile.building);
            
            // 添加游戏日志
            addLogEntry(`${currentPlayer.name}在坐标(${x}, ${y})建造了${BUILDINGS[buildingType].name}，花费${buildingCost}金币。`);
            
            // 显示通知
            showNotification(`建造${BUILDINGS[buildingType].name}成功！`);
            
            return true;
        }

        // 处理医院治疗单位
        function processHospitalHealing() {
            const currentPlayer = gameState.players[gameState.currentPlayerIndex];
            const healAmount = 20; // 每次治疗恢复的生命值
            
            // 查找当前玩家所有的医院和大医院
            const hospitals = [];
            const bigHospitals = [];
            
            gameState.map.forEach(tile => {
                if (tile.ownerId === currentPlayer.id && tile.building) {
                    if (tile.building.type === 'hospital') {
                        hospitals.push(tile);
                    } else if (tile.building.type === 'bigHospital') {
                        bigHospitals.push(tile);
                    }
                }
            });
            
            // 处理普通医院治疗（每个医院治疗1个单位）
            hospitals.forEach(hospitalTile => {
                // 寻找附近的受伤单位（优先治疗伤势最重的）
                const injuredUnit = findNearbyInjuredUnit(hospitalTile.x, hospitalTile.y);
                
                if (injuredUnit) {
                    healUnit(injuredUnit, healAmount);
                    addLogEntry(`${currentPlayer.name}的医院治疗了一个${UNITS[injuredUnit.type].name}，恢复了${healAmount}点生命值。`);
                }
            });
            
            // 处理大医院治疗（每个大医院治疗3个单位）
            bigHospitals.forEach(hospitalTile => {
                let healsRemaining = 3; // 大医院每回合可以治疗3个单位
                
                while (healsRemaining > 0) {
                    // 寻找附近的受伤单位
                    const injuredUnit = findNearbyInjuredUnit(hospitalTile.x, hospitalTile.y);
                    
                    if (injuredUnit) {
                        healUnit(injuredUnit, healAmount);
                        addLogEntry(`${currentPlayer.name}的大医院治疗了一个${UNITS[injuredUnit.type].name}，恢复了${healAmount}点生命值。`);
                        healsRemaining--;
                    } else {
                        // 没有更多受伤单位了
                        break;
                    }
                }
            });
        }

        // 寻找附近受伤的单位（优先找生命值百分比最低的）
        function findNearbyInjuredUnit(x, y, range = 3) {
            const currentPlayer = gameState.players[gameState.currentPlayerIndex];
            let injuredUnits = [];
            
            // 查找范围内的所有受伤单位
            for (let dy = -range; dy <= range; dy++) {
                for (let dx = -range; dx <= range; dx++) {
                    const nx = x + dx;
                    const ny = y + dy;
                    
                    // 确保在地图范围内
                    if (nx >= 0 && nx < GRID_WIDTH && ny >= 0 && ny < GRID_HEIGHT) {
                        const tileIndex = ny * GRID_WIDTH + nx;
                        const tile = gameState.map[tileIndex];
                        
                        // 检查是否是当前玩家的受伤单位
                        if (tile.unit && 
                            tile.unit.ownerId === currentPlayer.id && 
                            tile.unit.health < UNITS[tile.unit.type].health) {
                            
                            // 计算生命值百分比
                            const healthPercent = tile.unit.health / UNITS[tile.unit.type].health;
                            
                            injuredUnits.push({
                                unit: tile.unit,
                                healthPercent: healthPercent,
                                tileIndex: tileIndex
                            });
                        }
                    }
                }
            }
            
            // 按生命值百分比升序排序（优先治疗生命值百分比最低的）
            injuredUnits.sort((a, b) => a.healthPercent - b.healthPercent);
            
            // 返回生命值百分比最低的单位
            return injuredUnits.length > 0 ? injuredUnits[0].unit : null;
        }

        // 治疗单位
        function healUnit(unit, amount) {
            const maxHealth = UNITS[unit.type].health;
            
            // 增加生命值但不超过最大值
            unit.health = Math.min(unit.health + amount, maxHealth);
            
            // 更新地图上的单位状态
            const tileIndex = unit.y * GRID_WIDTH + unit.x;
            if (gameState.map[tileIndex].unit) {
                gameState.map[tileIndex].unit.health = unit.health;
            }
        }
